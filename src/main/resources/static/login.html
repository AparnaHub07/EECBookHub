<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — EEC BookHub</title>
<link rel="icon" href="images/eec-logo.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<style>
  .centered-auth{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 20px;
    background:
      radial-gradient(circle at 15% 15%, var(--spine-light) 0%, transparent 40%),
      radial-gradient(circle at 85% 85%, #F1E4C4 0%, transparent 40%),
      var(--paper); }
  html[data-theme="dark"] .centered-auth{ background:
      radial-gradient(circle at 15% 15%, var(--spine-light) 0%, transparent 40%),
      radial-gradient(circle at 85% 85%, #2b2416 0%, transparent 40%),
      var(--paper); }
  .auth-card{ width:100%; max-width:430px; background:var(--paper-card); border:1px solid var(--paper-line);
    border-radius:var(--radius-l); box-shadow:0 20px 60px rgba(28,43,58,.12); padding:40px 36px; text-align:center; }
  .auth-card .badge-lg{ width:88px; height:88px; border-radius:50%; object-fit:cover; box-shadow:0 4px 16px rgba(28,43,58,.18); }
  .auth-card h2{ margin:18px 0 2px; }
  .auth-card p.sub{ font-size:.9rem; margin-bottom:22px; }
  .auth-card form{ text-align:left; }
</style>
</head>
<body>
<div class="centered-auth">
  <div class="auth-card">
    <img src="images/eec-logo.png" class="badge-lg" alt="Easwari Engineering College emblem">
    <h2>EEC BookHub</h2>
    <p class="sub text-muted-c">Log in with your verified Easwari Engineering College student account.</p>

    <div id="alertBox" class="d-none alert" role="alert" style="border-radius:var(--radius-m); text-align:left;"></div>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label class="form-label">College Email</label>
        <input type="email" class="form-control" id="email" placeholder="Enter your college email ID" required autocomplete="username">
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="password" placeholder="Enter your password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-spine btn-block">Log In</button>
      <div class="text-end mt-2"><a href="#" id="forgotLink" style="color:var(--spine);font-size:.85rem;font-weight:700;">Forgot password?</a></div>
    </form>

    <hr class="divider-line">
    <p style="font-size:.88rem;">New to EEC BookHub? <a href="register.html" style="color:var(--spine); font-weight:700;">Create an account</a></p>
    <p style="font-size:.8rem;"><a href="index.html" style="color:var(--text-muted);">← Back to home</a></p>
  </div>
</div>


<!-- Real email OTP password reset -->
<div class="modal fade" id="forgotModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title font-display">Reset Password</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <div id="forgotAlert" class="alert d-none"></div>
      <div class="mb-3"><label class="form-label">Registered College Email</label><input type="email" class="form-control" id="forgotEmail" placeholder="Enter your college email"></div>
      <button class="btn btn-outline-spine w-100 mb-3" id="sendOtpBtn">Send OTP</button>
      <div id="resetFields" class="d-none">
        <div class="mb-3"><label class="form-label">6-digit OTP</label><input type="text" inputmode="numeric" maxlength="6" class="form-control" id="forgotOtp" placeholder="Enter OTP"></div>
        <div class="mb-3"><label class="form-label">New Password</label><input type="password" minlength="6" class="form-control" id="newPassword" placeholder="Minimum 6 characters"></div>
        <button class="btn btn-spine w-100" id="resetPasswordBtn">Reset Password</button>
      </div>
    </div>
  </div></div>
</div>

<div id="toastStack"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
<script>
function showAlert(msg, kind){
  const box = document.getElementById('alertBox');
  box.className = 'alert alert-' + kind;
  box.textContent = msg;
  box.classList.remove('d-none');
}
document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  if(!password){ showAlert('Please enter your password.', 'warning'); return; }
  const res = EEC.login(email, password);
  if(res.ok){
    EEC.toast('Welcome back, ' + res.user.name.split(' ')[0] + '!', 'success');
    setTimeout(()=> window.location.href = 'dashboard.html', 400);
  } else {
    showAlert(res.message || 'Login failed. Please check your details and try again.', 'danger');
  }
});

const forgotModal = new bootstrap.Modal(document.getElementById('forgotModal'));
document.getElementById('forgotLink').addEventListener('click', e=>{ e.preventDefault(); document.getElementById('forgotEmail').value=document.getElementById('email').value.trim(); forgotModal.show(); });
function forgotMsg(msg, kind='info'){ const b=document.getElementById('forgotAlert'); b.className='alert alert-'+kind; b.textContent=msg; b.classList.remove('d-none'); }
document.getElementById('sendOtpBtn').addEventListener('click', ()=>{
  const email=document.getElementById('forgotEmail').value.trim();
  const res=EEC.requestPasswordOtp(email);
  if(res.ok){ forgotMsg(res.message || 'OTP sent to your registered college email.','success'); document.getElementById('resetFields').classList.remove('d-none'); }
  else forgotMsg(res.message || EEC.getLastError(),'danger');
});
document.getElementById('resetPasswordBtn').addEventListener('click', ()=>{
  const email=document.getElementById('forgotEmail').value.trim(), otp=document.getElementById('forgotOtp').value.trim(), pw=document.getElementById('newPassword').value;
  if(!/^\d{6}$/.test(otp) || pw.length<6){ forgotMsg('Enter the 6-digit OTP and a password of at least 6 characters.','warning'); return; }
  const res=EEC.resetPassword(email,otp,pw);
  if(res.ok){ forgotMsg(res.message,'success'); setTimeout(()=>forgotModal.hide(),900); } else forgotMsg(res.message || EEC.getLastError(),'danger');
});
</script>
</body>
</html>
