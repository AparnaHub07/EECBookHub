<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — EEC BookHub</title>
<link rel="icon" href="images/eec-logo.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<style>
  .centered-auth{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 20px;
    background:
      radial-gradient(circle at 15% 15%, var(--spine-light) 0%, transparent 40%),
      radial-gradient(circle at 85% 85%, #F1E4C4 0%, transparent 40%),
      var(--paper); }
  html[data-theme="dark"] .centered-auth{ background:
      radial-gradient(circle at 15% 15%, var(--spine-light) 0%, transparent 40%),
      radial-gradient(circle at 85% 85%, #2b2416 0%, transparent 40%),
      var(--paper); }
  .auth-card{ width:100%; max-width:560px; background:var(--paper-card); border:1px solid var(--paper-line);
    border-radius:var(--radius-l); box-shadow:0 20px 60px rgba(28,43,58,.12); padding:40px 36px; text-align:center; }
  .auth-card .badge-lg{ width:76px; height:76px; border-radius:50%; object-fit:cover; box-shadow:0 4px 16px rgba(28,43,58,.18); }
  .auth-card h2{ margin:14px 0 2px; }
  .auth-card p.sub{ font-size:.9rem; margin-bottom:20px; }
  .auth-card form{ text-align:left; }
</style>
</head>
<body>
<div class="centered-auth">
  <div class="auth-card">
    <img src="images/eec-logo.png" class="badge-lg" alt="Easwari Engineering College emblem">
    <h2>Create your account</h2>
    <p class="sub text-muted-c">Registration is open only to verified Easwari Engineering College students.</p>

    <div id="alertBox" class="d-none alert" role="alert" style="border-radius:var(--radius-m); text-align:left;"></div>

    <form id="regForm" novalidate>
      <div class="row">
        <div class="col-md-7 mb-3"><label class="form-label">Full Name</label><input type="text" class="form-control" id="name" placeholder="e.g. Priya Venkatesan" required></div>
        <div class="col-md-5 mb-3"><label class="form-label">Phone Number</label><input type="tel" class="form-control" id="phone" placeholder="10-digit mobile number" pattern="[0-9]{10}" required></div>
      </div>
      <div class="mb-3">
        <label class="form-label">College Email</label>
        <input type="email" class="form-control" id="email" placeholder="Enter your college email ID" required autocomplete="username">
        <div class="input-hint">Use your official Easwari Engineering College student email ID — it's verified automatically.</div>
      </div>
      <div class="row">
        <div class="col-md-7 mb-3">
          <label class="form-label">Department</label>
          <select class="form-select" id="dept" required>
            <option value="">Select department</option>
            <option>Computer Science & Engineering</option>
            <option>Information Technology</option>
            <option>Electronics & Communication</option>
            <option>Electrical & Electronics</option>
            <option>Mechanical Engineering</option>
            <option>Civil Engineering</option>
            <option>Artificial Intelligence & Data Science</option>
          </select>
        </div>
        <div class="col-md-5 mb-3">
          <label class="form-label">Year</label>
          <select class="form-select" id="year" required>
            <option value="">Year</option>
            <option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option>
          </select>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Create Password</label>
        <input type="password" class="form-control" id="password" placeholder="Minimum 6 characters" required minlength="6" autocomplete="new-password">
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="agree" required>
        <label class="form-check-label" for="agree" style="font-size:.85rem; color:var(--text-muted);">I confirm I am a current Easwari Engineering College student.</label>
      </div>
      <button type="submit" class="btn btn-spine btn-block">Create Account</button>
    </form>
    <hr class="divider-line">
    <p style="font-size:.88rem;">Already registered? <a href="login.html" style="color:var(--spine); font-weight:700;">Log in</a></p>
  </div>
</div>

<div id="toastStack"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
<script>
function showAlert(msg, kind){
  const box = document.getElementById('alertBox');
  box.className = 'alert alert-' + kind;
  box.textContent = msg;
  box.classList.remove('d-none');
}
document.getElementById('regForm').addEventListener('submit', function(e){
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const phone = document.getElementById('phone').value.trim();
  if(!/^[0-9]{10}$/.test(phone)){ showAlert('Please enter a valid 10-digit phone number.', 'warning'); return; }
  const res = EEC.register({
    name: document.getElementById('name').value.trim(),
    email: email,
    phone: phone,
    dept: document.getElementById('dept').value,
    year: document.getElementById('year').value,
    password: document.getElementById('password').value
  });
  if(res.ok){
    EEC.toast('Account created. Welcome to EEC BookHub, ' + res.user.name.split(' ')[0] + '!', 'success');
    setTimeout(()=> window.location.href='dashboard.html', 500);
  } else {
    showAlert(res.message || EEC.getLastError() || 'Registration failed.', 'danger');
  }
});
</script>
</body>
</html>
