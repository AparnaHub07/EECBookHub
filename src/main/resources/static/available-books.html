<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Available Books — EEC BookHub</title>
<link rel="icon" href="images/eec-logo.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="publicWrap" class="d-none">
  <header class="site-nav" id="siteNav"></header>
</div>
<div class="app-shell d-none" id="appWrap">
  <aside class="app-sidebar" id="sidebarMount"></aside>
  <div class="sidebar-scrim" id="sidebarScrim"></div>
  <div class="app-main">
    <header class="app-topbar" id="topbarMount"></header>
  </div>
</div>

<main id="mainContent" class="container-narrow" style="padding:32px 24px 60px;">
  <div class="page-head">
    <h1>Available Books</h1>
    <p>Every book currently listed and ready to borrow, posted by fellow Easwari students.</p>
  </div>
  <div class="d-flex flex-wrap gap-2 mb-3" id="catChips"></div>
  <div class="d-flex justify-content-between align-items-center mb-2">
    <span class="input-hint" id="resultCount"></span>
    <select class="form-select" id="qSort" style="width:auto;">
      <option value="newest">Newest first</option>
      <option value="rating">Highest rated</option>
      <option value="popular">Most borrowed</option>
    </select>
  </div>
  <div class="row g-3" id="resultsGrid"></div>
</main>

<footer class="site-footer d-none" id="siteFooter"></footer>
<div id="toastStack"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
<script>
const loggedIn = EEC.currentUser();
let activeUser = loggedIn;
if(loggedIn){
  document.getElementById('appWrap').classList.remove('d-none');
  activeUser = EEC.mountAppShell('available', 'Available Books');
  document.querySelector('.app-main').appendChild(document.getElementById('mainContent'));
  document.getElementById('mainContent').className = 'app-content';
} else {
  document.getElementById('publicWrap').classList.remove('d-none');
  document.getElementById('siteFooter').classList.remove('d-none');
  EEC.mountPublicNav('Browse Books');
  EEC.mountFooter();
}

const params = new URLSearchParams(window.location.search);
let activeCat = params.get('category') || '';

function renderChips(){
  const books = EEC.getBooks();
  const chips = [{key:'', name:'All Books', icon:'📚'}, ...EEC.CATEGORIES];
  document.getElementById('catChips').innerHTML = chips.map(c=>{
    const count = c.key ? books.filter(b=>b.category===c.key).length : books.length;
    return `<button class="btn btn-sm ${activeCat===c.key?'btn-spine':'btn-outline-ink'}" data-cat="${c.key}">${c.icon} ${c.name.split(' ')[0]} <span style="opacity:.7;">(${count})</span></button>`;
  }).join('');
  document.querySelectorAll('[data-cat]').forEach(btn=> btn.addEventListener('click', ()=>{ activeCat = btn.dataset.cat; renderChips(); renderResults(); }));
}

function renderResults(){
  let books = EEC.getBooks().filter(b=>b.status==='Available');
  if(activeCat) books = books.filter(b=> b.category===activeCat);
  const sort = document.getElementById('qSort').value;
  if(sort==='newest') books.sort((a,b)=> new Date(b.addedDate)-new Date(a.addedDate));
  if(sort==='rating') books.sort((a,b)=> (EEC.avgRating(b.id)||0)-(EEC.avgRating(a.id)||0));
  if(sort==='popular') books.sort((a,b)=> b.borrowCount-a.borrowCount);
  document.getElementById('resultCount').textContent = books.length + ' book(s) available';
  document.getElementById('resultsGrid').innerHTML = books.length ? books.map(b=>`<div class="col-lg-3 col-md-4 col-6">${EEC.bookCardHTML(b, {hideBorrow: !activeUser})}</div>`).join('')
    : `<div class="col-12"><div class="empty-state"><div class="e-icon">📭</div>No available books in this category right now.</div></div>`;
}
document.getElementById('qSort').addEventListener('change', renderResults);
renderChips();
renderResults();
</script>
</body>
</html>
