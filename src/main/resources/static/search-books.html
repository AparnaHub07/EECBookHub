<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search Books — EEC BookHub</title>
<link rel="icon" href="images/eec-logo.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar" id="sidebarMount"></aside>
  <div class="sidebar-scrim" id="sidebarScrim"></div>
  <div class="app-main">
    <header class="app-topbar" id="topbarMount"></header>
    <main class="app-content">
      <div class="page-head">
        <h1>Search Books</h1>
        <p>Find a book by name, author or category across every listing on campus.</p>
      </div>

      <div class="surface mb-4">
        <div class="row g-3 align-items-end">
          <div class="col-lg-4">
            <label class="form-label">Book Name</label>
            <input type="text" class="form-control" id="qTitle" placeholder="e.g. Clean Code">
          </div>
          <div class="col-lg-3">
            <label class="form-label">Author</label>
            <input type="text" class="form-control" id="qAuthor" placeholder="e.g. Paulo Coelho">
          </div>
          <div class="col-lg-3">
            <label class="form-label">Category</label>
            <select class="form-select" id="qCategory"><option value="">All categories</option></select>
          </div>
          <div class="col-lg-2">
            <button class="btn btn-spine btn-block" id="searchBtn">Search</button>
          </div>
        </div>
        <div class="row g-3 align-items-end mt-1">
          <div class="col-lg-3">
            <label class="form-label">Availability</label>
            <select class="form-select" id="qAvail">
              <option value="">All</option>
              <option value="Available">Available only</option>
              <option value="Borrowed">Currently borrowed</option>
            </select>
          </div>
          <div class="col-lg-3">
            <label class="form-label">Sort by</label>
            <select class="form-select" id="qSort">
              <option value="newest">Newest first</option>
              <option value="rating">Highest rated</option>
              <option value="popular">Most borrowed</option>
              <option value="az">Title A–Z</option>
            </select>
          </div>
          <div class="col-lg-3">
            <button class="btn btn-outline-ink btn-block" id="clearBtn">Clear filters</button>
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="input-hint" id="resultCount"></span>
      </div>
      <div class="row g-3" id="resultsGrid"></div>
      <div id="emptyState" class="empty-state d-none">
        <div class="e-icon">📭</div>
        <h3 style="font-size:1.1rem;">No books matched your search</h3>
        <p>Try a different title, author, or clear your filters.</p>
      </div>
    </main>
  </div>
</div>

<div id="toastStack"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
<script>
const user = EEC.mountAppShell('search', 'Search Books');
if(user){
  const catSel = document.getElementById('qCategory');
  EEC.CATEGORIES.forEach(c=> catSel.insertAdjacentHTML('beforeend', `<option value="${c.key}">${c.icon} ${c.name}</option>`));

  const params = new URLSearchParams(window.location.search);
  if(params.get('category')) catSel.value = params.get('category');
  if(params.get('q')) document.getElementById('qTitle').value = params.get('q');

  function runSearch(){
    let books = EEC.getBooks();
    const title = document.getElementById('qTitle').value.trim().toLowerCase();
    const author = document.getElementById('qAuthor').value.trim().toLowerCase();
    const cat = catSel.value;
    const avail = document.getElementById('qAvail').value;
    const sort = document.getElementById('qSort').value;

    if(title) books = books.filter(b=> b.title.toLowerCase().includes(title));
    if(author) books = books.filter(b=> b.author.toLowerCase().includes(author));
    if(cat) books = books.filter(b=> b.category===cat);
    if(avail) books = books.filter(b=> b.status===avail);

    if(sort==='newest') books.sort((a,b)=> new Date(b.addedDate)-new Date(a.addedDate));
    if(sort==='rating') books.sort((a,b)=> (EEC.avgRating(b.id)||0)-(EEC.avgRating(a.id)||0));
    if(sort==='popular') books.sort((a,b)=> b.borrowCount-a.borrowCount);
    if(sort==='az') books.sort((a,b)=> a.title.localeCompare(b.title));

    document.getElementById('resultCount').textContent = books.length + ' book(s) found';
    document.getElementById('resultsGrid').innerHTML = books.map(b=>`<div class="col-lg-3 col-md-4 col-6">${EEC.bookCardHTML(b)}</div>`).join('');
    document.getElementById('emptyState').classList.toggle('d-none', books.length>0);
  }
  ['qTitle','qAuthor'].forEach(id=> document.getElementById(id).addEventListener('keyup', runSearch));
  ['qCategory','qAvail','qSort'].forEach(id=> document.getElementById(id).addEventListener('change', runSearch));
  document.getElementById('searchBtn').addEventListener('click', runSearch);
  document.getElementById('clearBtn').addEventListener('click', ()=>{
    document.getElementById('qTitle').value=''; document.getElementById('qAuthor').value='';
    catSel.value=''; document.getElementById('qAvail').value=''; document.getElementById('qSort').value='newest';
    runSearch();
  });
  runSearch();
}
</script>
</body>
</html>
