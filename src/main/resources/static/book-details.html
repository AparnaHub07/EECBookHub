<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Details — EEC BookHub</title>
<link rel="icon" href="images/eec-logo.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar" id="sidebarMount"></aside>
  <div class="sidebar-scrim" id="sidebarScrim"></div>
  <div class="app-main">
    <header class="app-topbar" id="topbarMount"></header>
    <main class="app-content" id="content"></main>
  </div>
</div>
<div id="toastStack"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
<script>
const user = EEC.mountAppShell('available', 'Book Details');
if(user){
  const id = new URLSearchParams(window.location.search).get('id');
  const book = EEC.getBook(id);
  const content = document.getElementById('content');
  if(!book){
    content.innerHTML = `<div class="empty-state"><div class="e-icon">📕</div><h3>Book not found</h3><p>It may have been removed by its provider.</p><a href="available-books.html" class="btn btn-spine">Back to Available Books</a></div>`;
  } else {
    const c = EEC.catInfo(book.category);
    const rating = EEC.avgRating(book.id);
    const reviews = EEC.read('eec_reviews',[]).filter(r=>r.bookId===book.id);
    const isOwner = book.providerId === user.id;
    const providerContact = EEC.getBookContact(book.id);
    content.innerHTML = `
    <a href="available-books.html" class="input-hint">← Back to books</a>
    <div class="row g-4 mt-1">
      <div class="col-lg-4">
        <div style="border-radius:var(--radius-l); overflow:hidden; height:340px; position:relative; display:flex; align-items:flex-end; padding:22px; color:#fff; background:linear-gradient(150deg, ${c.color}, ${c.color}bb);">
          <div style="position:absolute; top:16px; right:18px; font-size:2.2rem; opacity:.85;">${c.icon}</div>
          <h2 style="color:#fff; margin:0;">${book.title}</h2>
        </div>
        <div class="surface mt-3">
          <h3 class="surface-title" style="font-size:1rem;">Provided by</h3>
          <div class="d-flex align-items-center gap-2">
            <div style="width:38px;height:38px;border-radius:50%;background:var(--spine);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;">${book.providerName.split(' ').map(w=>w[0]).join('').slice(0,2)}</div>
            <div><strong style="font-size:.9rem;">${book.providerName}</strong><div class="input-hint">Pickup: ${book.pickupLocation}</div><div class="input-hint">Return: ${book.returnLocation}</div><div class="input-hint">Contact: ${providerContact.visible ? '📞 '+providerContact.phone : 'Visible after request acceptance'}</div></div>
          </div>
        </div>
      </div>
      <div class="col-lg-8">
        <div class="d-flex gap-2 flex-wrap mb-2">
          <span class="badge-cat">${c.icon} ${c.name}</span>
          <span class="badge-status ${book.status==='Available'?'available':'borrowed'}">${book.status==='Available'?'🟢':'🔴'} ${book.status}</span>
        </div>
        <div class="b-author" style="font-size:1rem;">by ${book.author}</div>
        <div class="mt-1">${EEC.starHTML(rating)} <span class="input-hint">(${reviews.length} reviews) · Borrowed ${book.borrowCount} times</span></div>
        <p class="mt-3">${book.description}</p>
        <div class="row g-3 mt-1">
          <div class="col-md-3 col-6"><div class="stat-card accent-ink"><div class="stat-label">Condition</div><div class="stat-num" style="font-size:1.2rem;">${book.condition}</div></div></div>
          <div class="col-md-3 col-6"><div class="stat-card accent-ink"><div class="stat-label">Edition</div><div class="stat-num" style="font-size:1.2rem;">${book.edition}</div></div></div>
          <div class="col-md-3 col-6"><div class="stat-card accent-ink"><div class="stat-label">Borrow Duration</div><div class="stat-num" style="font-size:1.2rem;">${book.duration} days</div></div></div>
          <div class="col-md-3 col-6"><div class="stat-card accent-ink"><div class="stat-label">ISBN</div><div class="stat-num" style="font-size:1.2rem;">${book.isbn || '—'}</div></div></div>
        </div>
        <div class="mt-4">
          ${isOwner ? `<span class="input-hint">This is your own listing — manage it from Provide a Book.</span>`
            : `<button class="btn btn-spine" onclick="EEC.uiRequestBorrow('${book.id}')" ${book.status!=='Available'?'disabled':''}>Request to Borrow</button>`}
        </div>

        <hr class="divider-line">
        <h3 class="surface-title">Reviews & Ratings</h3>
        <div id="reviewList">
          ${reviews.length ? reviews.map(r=>`
            <div class="d-flex gap-3 py-3" style="border-bottom:1px solid var(--paper-line);">
              <div style="width:36px;height:36px;border-radius:50%;background:var(--stamp-light,var(--spine-light));color:var(--spine-dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.75rem; flex-shrink:0;">${r.userName.split(' ').map(w=>w[0]).join('').slice(0,2)}</div>
              <div><strong style="font-size:.88rem;">${r.userName}</strong> <span style="color:var(--stamp-dark);">${'⭐'.repeat(r.rating)}</span>
              <div class="input-hint">${EEC.fmtDate(r.date)}</div>
              <p style="margin:6px 0 0; font-size:.88rem; color:var(--text);">${r.comment}</p></div>
            </div>`).join('') : `<p class="input-hint">No reviews yet — be the first to review after borrowing.</p>`}
        </div>
      </div>
    </div>`;
  }
}
</script>
</body>
</html>
